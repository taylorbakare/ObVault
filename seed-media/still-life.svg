<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Flat illustration still life with a cassette and ivy">
  <defs>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="#efe7d6"/>
  <rect x="70" y="70" width="1060" height="1060" fill="#e6dcc6"/>
  <!-- table -->
  <rect x="70" y="760" width="1060" height="370" fill="#c9b492"/>
  <rect x="70" y="760" width="1060" height="14" fill="#b8a17c"/>
  <!-- wall shadow -->
  <ellipse cx="640" cy="770" rx="430" ry="26" fill="#a08d6c" opacity="0.45"/>
  <!-- cloth -->
  <path d="M170 760 Q330 700 470 760 T760 760 T1050 760 L1050 860 Q900 900 760 860 T470 860 T180 860 Z" fill="#9c4f33"/>
  <!-- cassette -->
  <g transform="translate(400 560) rotate(-4)">
    <rect width="400" height="252" rx="10" fill="#2e2a26"/>
    <rect x="26" y="26" width="348" height="200" rx="6" fill="#3b352f"/>
    <circle cx="130" cy="126" r="42" fill="#efe7d6"/>
    <circle cx="270" cy="126" r="42" fill="#efe7d6"/>
    <circle cx="130" cy="126" r="12" fill="#2e2a26"/>
    <circle cx="270" cy="126" r="12" fill="#2e2a26"/>
    <rect x="150" y="186" width="100" height="16" rx="8" fill="#b0522f"/>
    <path d="M130 126 L270 126" stroke="#efe7d6" stroke-width="2" stroke-dasharray="3 6"/>
  </g>
  <!-- ivy pot -->
  <g>
    <path d="M820 600 Q810 700 820 760 L960 760 Q972 700 960 600 Z" fill="#b9a488"/>
    <path d="M818 640 Q890 660 962 640" stroke="#8a745a" stroke-width="8" fill="none"/>
    <path d="M890 600 C 830 540 860 470 905 440" stroke="#5c6b4a" stroke-width="10" fill="none"/>
    <path d="M890 600 C 950 560 980 500 950 440" stroke="#6b7a52" stroke-width="10" fill="none"/>
    <ellipse cx="895" cy="432" rx="30" ry="12" fill="#6b7a52"/>
    <ellipse cx="952" cy="432" rx="26" ry="10" fill="#5c6b4a"/>
    <ellipse cx="860" cy="510" rx="24" ry="11" fill="#5c6b4a" transform="rotate(-30 860 510)"/>
    <ellipse cx="965" cy="520" rx="24" ry="11" fill="#6b7a52" transform="rotate(28 965 520)"/>
  </g>
  <!-- mug -->
  <g transform="translate(230 620)">
    <path d="M0 0 L140 0 L128 140 L12 140 Z" fill="#4a5a68"/>
    <path d="M140 30 Q196 40 192 78 Q188 116 126 122" stroke="#4a5a68" stroke-width="14" fill="none"/>
    <rect x="0" y="-8" width="140" height="16" rx="6" fill="#5d6f7f"/>
  </g>
  <rect width="1200" height="1200" filter="url(#g)" opacity="0.05"/>
</svg>
