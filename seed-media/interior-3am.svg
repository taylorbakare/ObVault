<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Film still of an interior at 3 a.m., window light on floorboards">
  <defs>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#e9dcbc" stop-opacity="0.95"/><stop offset="1" stop-color="#e9dcbc" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#17130f"/>
  <!-- window light -->
  <path d="M180 0 L620 0 L520 1000 L60 1000 Z" fill="url(#light)"/>
  <!-- window frame shadows -->
  <g fill="#17130f" opacity="0.85">
    <path d="M330 0 L370 0 L330 1000 L290 1000 Z"/>
    <path d="M180 470 L620 470 L600 540 L170 540 Z" transform="translate(0 60) skewY(-8)"/>
  </g>
  <!-- floorboards -->
  <g stroke="#241d16" stroke-width="4">
    <path d="M0 700 Q800 640 1600 700"/>
    <path d="M0 800 Q800 745 1600 800"/>
    <path d="M0 900 Q800 850 1600 900"/>
    <path d="M300 640 L180 1000"/>
    <path d="M800 600 L720 1000"/>
    <path d="M1300 620 L1260 1000"/>
  </g>
  <!-- bed silhouette -->
  <path d="M900 1000 L900 780 Q900 740 960 740 L1560 720 L1560 1000 Z" fill="#0e0b09"/>
  <rect x="1150" y="640" width="220" height="90" rx="26" fill="#12100d"/>
  <!-- letters on the floor -->
  <g fill="#e9dcbc" opacity="0.85">
    <rect x="700" y="870" width="90" height="60" transform="rotate(-14 700 870)"/>
    <rect x="760" y="930" width="70" height="46" transform="rotate(9 760 930)"/>
  </g>
  <rect width="1600" height="1000" filter="url(#g)" opacity="0.12"/>
</svg>
