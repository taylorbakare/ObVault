<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="Risograph study with overlapping red and blue shapes">
  <defs>
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="#f1ece0"/>
  <!-- red plate -->
  <g fill="#c0502e" style="mix-blend-mode:multiply">
    <circle cx="420" cy="460" r="240"/>
    <path d="M600 700 L980 700 L790 1050 Z"/>
    <rect x="180" y="820" width="260" height="420" rx="130"/>
  </g>
  <!-- blue plate -->
  <g fill="#3d5a80" style="mix-blend-mode:multiply">
    <circle cx="780" cy="520" r="260"/>
    <rect x="520" y="900" width="420" height="120" rx="60"/>
    <circle cx="380" cy="1120" r="90"/>
  </g>
  <!-- ochre plate -->
  <g fill="#d9a04a" style="mix-blend-mode:multiply">
    <rect x="300" y="240" width="600" height="80" rx="40"/>
    <circle cx="620" cy="1220" r="150"/>
  </g>
  <rect width="1200" height="1500" filter="url(#g)" opacity="0.14"/>
</svg>
